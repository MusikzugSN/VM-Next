name: Backport

# Label a PR on master with "backport release/X.Y" (before or after merging). Once it is merged,
# this opens a PR with the cherry-picked commits against release/X.Y. On conflicts it opens a
# draft PR with instructions instead. See docs/release.md.
on:
  pull_request_target:
    types: [closed, labeled]
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    if: >-
      github.event.pull_request.merged == true &&
      contains(join(github.event.pull_request.labels.*.name, ' '), 'backport release/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: korthout/backport-action@v3
        with:
          # PRs opened with the default GITHUB_TOKEN do not start CI; a token from a GitHub App or a
          # fine-grained PAT (contents + pull requests: write) in BACKPORT_TOKEN avoids that.
          github_token: ${{ secrets.BACKPORT_TOKEN || secrets.GITHUB_TOKEN }}
          label_pattern: '^backport (release/\d+\.\d+)$'
          pull_title: '[${target_branch}] ${pull_title}'
          pull_description: |-
            Backport of #${pull_number} to `${target_branch}`.
          experimental: '{"conflict_resolution": "draft_commit_conflicts"}'
