<fieldset class="flex flex-col gap-2">
  <legend class="mb-2 font-medium">{{ legendKey() | transloco }}{{ required() ? ' *' : '' }}</legend>
  <div role="radiogroup" class="grid gap-2" [class.sm:grid-cols-2]="options().length === 2">
    @for (o of options(); track o.value) {
      <button
        type="button"
        role="radio"
        [attr.aria-checked]="value() === o.value"
        [disabled]="readonly()"
        (click)="valueChange.emit(o.value)"
        class="flex min-h-target items-start gap-3 rounded-small border px-3 py-2 text-start disabled:cursor-default"
        [class]="value() === o.value ? 'border-primary bg-primary-soft text-primary' : 'border-input bg-background'"
      >
        <span class="mt-1 flex size-4 shrink-0 items-center justify-center rounded-full border" [class.border-primary]="value() === o.value" aria-hidden="true">
          @if (value() === o.value) {
            <span class="size-2 rounded-full bg-primary"></span>
          }
        </span>
        <span class="flex flex-col">
          <span class="font-medium">{{ o.labelKey | transloco }}</span>
          @if (o.hintKey) {
            <span class="text-body-medium text-muted-foreground">{{ o.hintKey | transloco }}</span>
          }
        </span>
      </button>
    }
  </div>
</fieldset>
