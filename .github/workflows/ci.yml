name: CI

on:
  pull_request:
    branches: [master, 'release/**']
  push:
    branches: [master, 'release/**']
  # The release workflows run the same checks before they tag
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vmweb
          POSTGRES_PASSWORD: vmweb
          POSTGRES_DB: vmweb_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vmweb -d vmweb_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # API integration tests create their own databases next to this one
      TEST_DATABASE_URL: postgres://vmweb:vmweb@localhost:5432/vmweb_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t lint typecheck --output-style=static
      - run: pnpm nx run-many -t test --output-style=static
      - run: pnpm nx run-many -t build --configuration=production --output-style=static

  migrations:
    name: Migrations match master
    # only where bugfixes are backported: PRs into and pushes on release branches
    if: startsWith(github.base_ref, 'release/') || startsWith(github.ref_name, 'release/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node .github/scripts/check-migrations.mjs origin/master

  docker:
    name: Docker image ${{ matrix.app }}
    # images are built for real in release-build.yml; here only check that they still build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=vm-next-${{ matrix.app }}
