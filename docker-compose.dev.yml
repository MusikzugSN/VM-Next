# Local development services: MySQL and Pocket ID (OIDC identity server).
# Start:  pnpm dev:up      Stop: pnpm dev:down      (see apps/api/README.md)
name: vm-web-dev

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: vmweb
      MYSQL_DATABASE: vmweb
      MYSQL_USER: vmweb
      MYSQL_PASSWORD: vmweb
    ports:
      # 3307 on the host: a local MySQL often occupies 3306
      - '127.0.0.1:3307:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -pvmweb --silent']
      interval: 5s
      timeout: 3s
      retries: 10

  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2
    restart: unless-stopped
    environment:
      # Must match the address used in the browser and in OIDC_ISSUER_URL
      APP_URL: http://localhost:1411
      # Development only – never reuse this key outside the local machine
      ENCRYPTION_KEY: vm-web-local-dev-only-key-0123456789
      TRUST_PROXY: 'false'
    ports:
      - '127.0.0.1:1411:1411'
    volumes:
      - pocket-id-data:/app/data

volumes:
  mysql-data:
  pocket-id-data:
