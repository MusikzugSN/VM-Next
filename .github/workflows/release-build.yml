name: 'Release: Build and publish'

# Reusable: called by release-start.yml and release-patch.yml after they pushed the tag.
# Can also be run by hand to rebuild an existing tag (e.g. after a failed upload).
on:
  workflow_call:
    inputs:
      version:
        description: Version without "v", e.g. 1.2.3
        type: string
        required: true
      latest:
        description: Move the "latest" image tag and mark the GitHub release as latest
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: Existing version without "v", e.g. 1.2.3
        type: string
        required: true
      latest:
        description: Move the "latest" image tag and mark the GitHub release as latest
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release-build-${{ inputs.version }}
  cancel-in-progress: false

env:
  TAG: v${{ inputs.version }}
  REGISTRY: ghcr.io/musikzugsn

jobs:
  images:
    name: Image vm-next-${{ matrix.app }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/vm-next-${{ matrix.app }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.latest }}
          labels: |
            org.opencontainers.image.title=vm-next-${{ matrix.app }}
            org.opencontainers.image.licenses=GPL-3.0-only
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          # build stages run natively; only the small runtime stages are emulated for arm64
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=vm-next-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=vm-next-${{ matrix.app }}
          provenance: true
          sbom: true

  print-service:
    name: Print service linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node apps/print-service/scripts/build-sea.mjs
      - name: Smoke test
        # the binary must start without Node and reject foreign origins (no CUPS on the runner)
        run: |
          VMWEB_PRINT_ORIGIN=https://example.org ./dist/apps/print-service-sea/vm-web-print &
          pid=$!
          code=000
          for _ in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://other.example' http://127.0.0.1:17631/v1/status || true)
            [ "$code" = 403 ] && break
            sleep 0.5
          done
          kill "$pid"
          echo "foreign origin → $code"
          test "$code" = 403
      - uses: actions/upload-artifact@v4
        with:
          name: print-service-${{ matrix.arch }}
          path: dist/apps/print-service-sea/*.tar.gz
          if-no-files-found: error

  smoke:
    name: Stack starts
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VM_NEXT_VERSION: ${{ inputs.version }}
      MYSQL_PASSWORD: smoke-run-only
      PUBLIC_BASE_URL: http://127.0.0.1:8080
      OIDC_ISSUER_URL: https://example.invalid
      OIDC_CLIENT_ID: smoke
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the published images
        # no identity server needed: OIDC discovery runs on the first login, not at startup
        working-directory: deploy
        run: docker compose up -d --wait --wait-timeout 300
      - name: Reach API and frontend through nginx
        run: |
          body=$(curl -fsS http://127.0.0.1:8080/health)
          echo "$body"
          echo "$body" | grep -q '"version":"${{ inputs.version }}"'
          curl -fsS -o /dev/null http://127.0.0.1:8080/index.html
      - name: Logs
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color

  release:
    name: GitHub release
    needs: [images, print-service, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: print-service-*
          path: assets
          merge-multiple: true
      - name: Collect assets
        run: |
          cp deploy/docker-compose.yml assets/docker-compose.yml
          cp deploy/.env.example assets/env.example
          cd assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="Images: \`${REGISTRY}/vm-next-api:${{ inputs.version }}\`, \`${REGISTRY}/vm-next-web:${{ inputs.version }}\`"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* \
              --verify-tag \
              --title "VM-Next ${{ inputs.version }}" \
              --generate-notes \
              --notes "$notes" \
              --latest=${{ inputs.latest }}
          fi
